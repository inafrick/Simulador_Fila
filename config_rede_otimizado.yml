# =============================================
# Rede de Filas Genérica — Validação (Otimizada)
# =============================================
# Topologia:
#   F1 (G/G/2/5) → 100% F2
#   F2 (G/G/3/10) → 20% F1, 70% F3, 10% sai do sistema
#   F3 (G/G/1/inf) → 100% sai do sistema
#
# Chegadas externas somente na F1 (1.0..5.0 min).
# Filas inicialmente vazias, primeiro cliente chega em t = 2.0.
# Simulação encerra ao consumir 100.000 números aleatórios.

# Gerador Congruencial Linear (LCG)
a: 16807
c: 0
M: 2147483648     # 2^31

aleatorios: 100000
semente: 123456.0

primeira_chegada:
  fila: F1
  tempo: 2.0

filas:
  F1:
    servidores: 2
    capacidade: 5
    chegada: [1.0, 5.0]
    atendimento: [2.0, 4.0]

  F2:
    servidores: 3       # mudou de 1 para 3
    capacidade: 10      # mudou de 4 para 10
    atendimento: [5.0, 10.0]

  F3:
    servidores: 1       # mudou de 3 para 1
    # capacidade omitida = infinita
    atendimento: [1.0, 3.0]

roteamento:
  F1:
    F2: 1.0     # 100% vai para F2

  F2:
    F1: 0.2     # 20% retorna para F1
    F3: 0.7     # 70% vai para F3
    # restante vira saída do sistema (0.1)